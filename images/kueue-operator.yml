cachito:
  packages:
    gomod:
      - path: .
content:
  source:
    dockerfile: Dockerfile
    git:
      branch:
        target: release-1.5
      url: git@github.com:openshift-priv/kueue-operator.git
      web: https://github.com/openshift/kueue-operator
distgit:
  bundle_component: kueue-operator-bundle-container
  branch: rhaos-{MAJOR}.{MINOR}-rhel-9
  component: kueue-operator-container
delivery:
  bundle_delivery_repo_name: kueue/kueue-operator-bundle
  delivery_repo_names:
  - kueue/kueue-rhel9-operator
from:
  builder:
  - stream: rhel-9-golang
  member: base-rhel9
name: kueue/kueue-rhel9-operator
name_in_bundle: kueue-rhel9-operator
owners:
- aos-team-art@redhat.com
update-csv:
  bundle-dir: manifests/
  manifests-dir: bundle-art/
  registry: image-registry.openshift-image-registry.svc:5000
  valid-subscription-label: '["OpenShift Kubernetes Engine", "OpenShift Container Platform", "OpenShift Platform Plus"]'
canonical_builders_from_upstream: false
