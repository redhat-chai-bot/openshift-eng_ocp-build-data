base_only: true
content:
  source:
    dockerfile: Containerfile
    git:
      branch:
        target: release-{MAJOR}.{MINOR}
      url: git@github.com:openshift-priv/images.git
      web: https://github.com/openshift/images
    path: static-base
    ci_alignment:
      streams_prs:
        # Try to have this PR merge as quickly as possible by pre-approving it.
        auto_label:
        - approved
        - lgtm
        merge_first: true
      # The build fetches RPMs from the public hummingbird repository, but
      # the resulting image is self-contained: mirror the Brew-built image
      # into CI for components to build against. Setting upstream_image
      # here ensures that reconciliation PRs for components referencing
      # this image as their base image use the mirrored image.
      mirror: true
      upstream_image: registry.ci.openshift.org/ocp/{MAJOR}.{MINOR}:static-base
distgit:
  # The image is built on RHEL 9 content via the ubi9-micro stream; the
  # image name itself is deliberately version-independent so consumers
  # need not care what userspace their static executables land in.
  branch: rhaos-{MAJOR}.{MINOR}-rhel-9
  component: openshift-enterprise-static-base-container
for_payload: false
for_release: false
from:
  stream: ubi9-micro
labels:
  License: GPLv2+
  io.k8s.description: This is the base image from which all static OpenShift Container Platform images inherit.
  io.k8s.display-name: OpenShift Container Platform Static Base
  io.openshift.tags: openshift,base,static
name: openshift/openshift-enterprise-static-base
owners:
- aos-team-art@redhat.com
# The rpmdb is hi/static's four hummingbird packages, whose .hum1 NVRs
# do not map to RHEL advisories; content is refreshed by rebuilding
# against the current hummingbird repository. Exempt it from scanning
# until the migration to hi/static gives it whatever scanning that
# image itself gets.
scan_sources:
  exempt_rpms:
  - '*'
# The Containerfile installs/updates RPMs from the public hummingbird
# repository (packages.redhat.com) during the image build. Hermetic mode
# cannot reach that host, so run this build with an open network until the
# content can be mirrored or vendored.
konflux:
  network_mode: open
okd:
  # OKD ships only x86_64 and aarch64, both published by the public
  # hi/static image, so OKD uses the real hardened static image instead
  # of reproducing the ubi9-micro subtraction: Containerfile.okd adds
  # nothing but the shared labels on top of it. OCP keeps the ubi9-micro
  # stream until hi/static is published for ppc64le as well.
  from:
    stream: hi-static
  content:
    source:
      dockerfile: Containerfile.okd
