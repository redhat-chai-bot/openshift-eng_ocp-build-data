base_image_release:
  force: true
cachito:
  packages:
    gomod:
      - path: .
      - path: external-providers/java-external-provider/
content:
  source:
    dockerfile: konflux.java-external-provider.Dockerfile
    git:
      branch:
        target: main
      url: git@github.com:openshift-priv/migtools-mta-analyzer-lsp.git
      web: https://github.com/migtools/mta-analyzer-lsp
    modifications:
      - action: replace
        match: "RUN CGO_ENABLED=1 GOOS=darwin go build"
        replacement: "RUN CGO_ENABLED=0 GOOS=darwin go build"
      - action: replace
        match: "RUN CGO_ENABLED=1 GOOS=windows go build"
        replacement: "RUN CGO_ENABLED=0 GOOS=windows go build"
jira:
  project: MTA
  component: Application Analysis
distgit:
  component: mta-java-external-provider-container
delivery:
  delivery_repo_names:
  - mta/mta-java-external-provider-rhel9
enabled_repos:
- rhel-98-appstream-rpms
- rhel-98-baseos-rpms
from:
  builder:
    - stream: rhel-9-golang
  member: mta-jdtls-server-base
name: mta/mta-java-external-provider-rhel9
owners:
- mta-devs@redhat.com
dependents:
  - mta-cli
  - mta-operator
