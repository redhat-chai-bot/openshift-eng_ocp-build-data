content:
  source:
    dockerfile: Dockerfile
    modifications:
    - action: replace
      match: "ARG RHEL_VERSION=''"
      replacement: "ARG RHEL_VERSION='9.2'"
    # Pin KERNEL_VERSION: kernel-modules-5.14.0-284.187.1.el9_2.ppc64le.rpm returns
    # HTTP 403 from RHEL 9.2 E4S CDN (ppc64le only). Pin to previous available version.
    # See ART-22685 for details. Remove this pin once the CDN issue is resolved.
    - action: replace
      match: "ARG KERNEL_VERSION=''"
      replacement: "ARG KERNEL_VERSION='5.14.0-284.186.1.el9_2'"

    # - action: replace
    #   match: "ARG RT_KERNEL_VERSION=''"
    #   replacement: "ARG RT_KERNEL_VERSION='1.2.3'"
    git:
      branch:
        target: release-{MAJOR}.{MINOR}
      url: git@github.com:openshift-priv/driver-toolkit.git
      web: https://github.com/openshift/driver-toolkit
distgit:
  branch: rhaos-{MAJOR}.{MINOR}-rhel-9
enabled_repos:
- rhel-9-server-ose-rpms-embargoed
- rhel-9-baseos-rpms
- rhel-9-appstream-rpms
- rhel-9-rt-rpms
for_payload: true
from:
  member: openshift-enterprise-base-rhel9
name: openshift/driver-toolkit-rhel9
owners:
- edge-sro@redhat.com
delivery:
  delivery_repo_names:
  - openshift4/driver-toolkit-rhel9
payload_name: driver-toolkit
